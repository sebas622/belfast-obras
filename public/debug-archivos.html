<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Debug Archivos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:monospace;padding:20px;background:#0F172A;color:#fff;font-size:12px;}button{padding:10px 20px;background:#1D4ED8;color:#fff;border:none;border-radius:8px;cursor:pointer;margin:5px;}pre{background:#1E293B;padding:10px;border-radius:8px;overflow-x:auto;white-space:pre-wrap;}</style>
</head>
<body>
<h2>🔍 Debug Archivos Supabase</h2>
<button onclick="verTodo()">Ver todas las keys bop_</button>
<button onclick="verArchivos()">Ver solo archivos (archs_)</button>
<button onclick="verLocalStorage()">Ver localStorage</button>
<div id="out"></div>
<script>
const URL = 'https://gibfrivfjtjjijihaxwh.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpYmZyaXZmanRqamlqaWhheHdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTgwOTIsImV4cCI6MjA5MjUzNDA5Mn0.gPOHrcQgjpspadROpAIlNbGlhRNi48sRiEr2BjJeQ-4';
const H = {'apikey':KEY,'Authorization':'Bearer '+KEY};

function out(html) { document.getElementById('out').innerHTML = html; }

async function verTodo() {
    const r = await fetch(URL+'/rest/v1/bcm_storage?select=key&key=like.bop_%25&order=key', {headers:H});
    const d = await r.json();
    out('<pre>'+d.map(x=>x.key).join('\n')+'</pre><p>Total: '+d.length+'</p>');
}

async function verArchivos() {
    const r = await fetch(URL+'/rest/v1/bcm_storage?select=key,value&key=like.bop_archs_%25', {headers:H});
    const d = await r.json();
    let html = '<p>Archivos en Supabase: '+d.length+'</p>';
    for(const row of d) {
        html += '<p><b>'+row.key+':</b></p>';
        try {
            const arr = JSON.parse(row.value);
            html += '<pre>'+JSON.stringify(arr,null,2)+'</pre>';
            // Verificar si los archdata existen
            for(const a of arr) {
                if(a.archKey) {
                    const r2 = await fetch(URL+'/rest/v1/bcm_storage?select=key&key=eq.'+encodeURIComponent(a.archKey), {headers:H});
                    const d2 = await r2.json();
                    html += '<p style="color:'+(d2.length?'#4ade80':'#f87171')+'">  '+a.archKey+': '+(d2.length?'✅ existe en Supabase':'❌ NO existe en Supabase')+'</p>';
                }
            }
        } catch(e) { html += '<p style="color:#f87171">Error: '+e.message+'</p>'; }
    }
    out(html);
}

function verLocalStorage() {
    const keys = Object.keys(localStorage).filter(k=>k.startsWith('bop_archs_')||k.startsWith('bop_archdata_'));
    let html = '<p>localStorage archivos: '+keys.length+'</p>';
    keys.forEach(k => {
        const v = localStorage.getItem(k);
        html += '<p><b>'+k+'</b>: '+v.length+' chars</p>';
    });
    out(html);
}
</script>
</body>
</html>
