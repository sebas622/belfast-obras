<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Borrar todo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; padding: 20px; background: #0F172A; color: #fff; }
h2 { font-size: 20px; margin-bottom: 8px; }
p { color: #94A3B8; font-size: 13px; margin-bottom: 20px; line-height: 1.6; }
button { width: 100%; padding: 16px; font-size: 15px; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; margin: 6px 0; }
.rojo { background: #DC2626; color: #fff; }
.gris { background: #334155; color: #94A3B8; }
#log { background: #1E293B; border-radius: 8px; padding: 14px; margin-top: 16px; font-size: 12px; line-height: 2; font-family: monospace; min-height: 80px; max-height: 60vh; overflow-y: auto; }
</style>
</head>
<body>
<h2>🗑 Borrar TODO — Belfast Obras</h2>
<p>Borra absolutamente todo: obras, proyectos, fotos, configuración, ubicaciones, usuarios. La app queda en cero total.</p>
<button class="rojo" onclick="borrarTodo()">🗑 BORRAR TODO AHORA</button>
<button class="gris" onclick="window.location='/'">← Volver a la app</button>
<div id="log">Listo...</div>
<script>
const SUPA_URL = 'https://gibfrivfjtjjijihaxwh.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpYmZyaXZmanRqamlqaWhheHdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTgwOTIsImV4cCI6MjA5MjUzNDA5Mn0.gPOHrcQgjpspadROpAIlNbGlhRNi48sRiEr2BjJeQ-4';
const H = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' };
const logEl = document.getElementById('log');
function log(msg) { logEl.innerHTML += msg + '<br>'; logEl.scrollTop = logEl.scrollHeight; }

async function borrarTodo() {
    logEl.innerHTML = '';
    log('⏳ Obteniendo todas las filas...');
    let todas = [];
    try {
        for (let offset = 0; offset < 5000; offset += 1000) {
            const r = await fetch(`${SUPA_URL}/rest/v1/bcm_storage?select=key&limit=1000&offset=${offset}`, { headers: H });
            const batch = await r.json();
            if (!batch.length) break;
            todas = todas.concat(batch);
        }
        log(`📋 ${todas.length} filas en Supabase`);
    } catch(e) { log('Error: ' + e.message); return; }

    // Borrar ABSOLUTAMENTE TODO bop_
    const aBorrar = todas.filter(k => k.key.startsWith('bop_') || k.key.startsWith('fotodata_') || k.key.startsWith('push_sub_'));
    log(`🎯 Borrando ${aBorrar.length} filas...`);
    let n = 0;
    for (const row of aBorrar) {
        await fetch(`${SUPA_URL}/rest/v1/bcm_storage?key=eq.${encodeURIComponent(row.key)}`, { method: 'DELETE', headers: H });
        n++;
        if (n % 10 === 0) log(`  ${n}/${aBorrar.length}...`);
    }
    // Wildcards
    await fetch(`${SUPA_URL}/rest/v1/bcm_storage?key=like.bop_%25`, { method: 'DELETE', headers: H });
    await fetch(`${SUPA_URL}/rest/v1/bcm_storage?key=like.fotodata_%25`, { method: 'DELETE', headers: H });
    log(`✅ ${n} filas borradas de Supabase`);

    // Borrar TODO localStorage
    localStorage.clear();
    localStorage.setItem('bop_borrado_en', Date.now().toString());
    log('✅ localStorage limpio');

    // Service worker y caché
    try {
        if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister()));
        }
        const cacheKeys = await caches.keys();
        await Promise.all(cacheKeys.map(k => caches.delete(k)));
        log('✅ Caché borrado');
    } catch(e) { log('Caché: ' + e.message); }

    log('');
    log('🎉 TODO EN CERO — redirigiendo...');
    setTimeout(() => window.location = '/', 3000);
}
</script>
</body>
</html>
